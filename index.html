<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>学中文 · Mandarim</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E;
  --red-deep:#8B0000;
  --red-soft:#E63946;
  --gold:#D4AF37;
  --gold-light:#F4D03F;
  --gold-bright:#FFDE00;
  --cream:#FFF8E7;
  --paper:#F5E6D3;
  --paper-dark:#E8D5B7;
  --ink:#1A1A1A;
  --ink-soft:#4A3F35;
  --jade:#2A9D8F;
  --bamboo:#4A7C2E;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;padding:0;
  font-family:"ZCOOL XiaoWei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 15% 20%, rgba(212,175,55,.08) 0, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(200,16,46,.05) 0, transparent 45%),
    var(--cream);
}
.hanzi-font{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-weight:700}
.brush-font{font-family:"Ma Shan Zheng","ZCOOL XiaoWei",cursive}
#app{flex:1;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input{font-family:inherit}

/* ===== Status bar ===== */
.status{
  display:flex;align-items:center;gap:10px;
  padding:max(env(safe-area-inset-top),12px) 16px 10px;
  background:linear-gradient(180deg,#fff 0%,var(--cream) 100%);
  border-bottom:2px solid var(--gold);
  position:relative;
}
.status::after{
  content:"";position:absolute;left:0;right:0;bottom:-6px;height:4px;
  background:repeating-linear-gradient(90deg,var(--red) 0 12px,transparent 12px 16px);
  opacity:.5;
}
.pill{
  display:flex;align-items:center;gap:5px;
  background:#fff;padding:6px 11px;border-radius:999px;
  font-weight:700;font-size:13px;color:var(--ink);
  border:1.5px solid var(--gold);
}
.pill.hearts{border-color:var(--red);color:var(--red)}
.xp-wrap{flex:1}
.xp-bg{height:10px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--paper-dark)}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold-bright),var(--gold));transition:width .3s}
.xp-label{font-size:10px;color:var(--ink-soft);margin-top:3px;text-align:center;font-weight:700}

/* ===== Home ===== */
.home{padding:18px 16px 40px;flex:1;overflow-y:auto}
.home-hero{
  position:relative;text-align:center;padding:22px 12px 24px;margin-bottom:18px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,222,0,.15) 0, transparent 60%),
    linear-gradient(180deg,#fff 0%,var(--paper) 100%);
  border-radius:18px;
  border:2px solid var(--gold);
  overflow:hidden;
}
.home-hero::before,.home-hero::after{
  content:"";position:absolute;width:46px;height:60px;top:10px;
  background:
    radial-gradient(ellipse at 50% 40%, var(--red) 60%, var(--red-deep) 100%);
  border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:0 4px 8px rgba(139,0,0,.25);
}
.home-hero::before{left:14px;transform:rotate(-8deg)}
.home-hero::after{right:14px;transform:rotate(8deg)}
.home-title{
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:54px;color:var(--red);margin:6px 0 0;
  text-shadow:2px 2px 0 var(--gold-light);letter-spacing:4px;
}
.home-sub{font-size:14px;color:var(--ink-soft);margin:4px 0 0;font-weight:700}
.home-divider{
  display:flex;align-items:center;gap:10px;margin:16px 4px 14px;
}
.home-divider::before,.home-divider::after{
  content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.home-divider span{font-size:12px;font-weight:800;color:var(--red);letter-spacing:3px}

.level-card{
  position:relative;
  border-radius:16px;padding:18px;margin-bottom:14px;
  color:#fff;width:100%;text-align:left;display:block;
  border:2px solid var(--gold);
  box-shadow:0 4px 12px rgba(139,0,0,.18);
  overflow:hidden;
}
.level-card::before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(255,222,0,.4);
  border-radius:12px;pointer-events:none;
}
.level-card[disabled]{opacity:1;background:#9a8a7a !important;border-color:#bbb;box-shadow:none}
.level-card-head{display:flex;justify-content:space-between;align-items:center;position:relative}
.level-card-tag{font-size:11px;font-weight:800;letter-spacing:2px;opacity:.95;text-transform:uppercase}
.level-card-icon{font-size:20px}
.level-card-cn{
  font-family:"Noto Serif SC",serif;font-size:28px;font-weight:900;
  margin:6px 0 0;letter-spacing:2px;
}
.level-card-title{font-size:18px;font-weight:800;margin:2px 0 0}
.level-card-sub{font-size:13px;opacity:.92;margin:0 0 12px;font-weight:600}
.lc-prog-bg{height:7px;background:rgba(0,0,0,.22);border-radius:4px;overflow:hidden}
.lc-prog-fill{height:100%;background:var(--gold-bright);transition:width .3s}
.lc-prog-label{font-size:12px;margin-top:6px;opacity:.95;font-weight:700}

.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.home-action{
  padding:14px 10px;background:#fff;border:2px solid var(--gold);border-radius:12px;
  font-weight:800;color:var(--ink);text-align:center;font-size:13px;
}
.home-action .ha-icon{display:block;font-size:22px;margin-bottom:4px}

/* ===== Level page ===== */
.level-page{flex:1;display:flex;flex-direction:column;min-height:0}
.level-header{
  padding:16px 20px 24px;color:#fff;position:relative;
  background-image:
    radial-gradient(circle at 90% 20%, rgba(255,222,0,.15) 0, transparent 40%),
    radial-gradient(circle at 10% 80%, rgba(255,255,255,.1) 0, transparent 40%);
}
.level-header h1{font-size:26px;font-weight:900;margin:0;letter-spacing:1px}
.level-header .cn{font-family:"Noto Serif SC",serif;font-size:32px;margin:0 0 4px;letter-spacing:3px;opacity:.95}
.level-header p{opacity:.92;font-size:13px;margin:2px 0 0;font-weight:600}
.level-body{
  flex:1;background:var(--cream);
  border-top-left-radius:22px;border-top-right-radius:22px;
  padding:18px 16px 40px;overflow-y:auto;
  border-top:2px solid var(--gold);
}
.lesson-item{
  display:flex;align-items:center;gap:14px;
  background:#fff;padding:14px;border-radius:14px;
  margin-bottom:10px;border:1.5px solid var(--paper-dark);width:100%;text-align:left;
  transition:transform .15s;
}
.lesson-item:active{transform:scale(.98)}
.lesson-item[disabled]{background:#f0e7d8;opacity:.6}
.lesson-item.done{border-color:var(--jade);border-width:2px;background:#F0FBF8}
.circle{
  width:46px;height:46px;border-radius:23px;
  background:var(--gold);color:#fff;font-weight:900;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:2px solid #fff;box-shadow:0 0 0 1.5px var(--gold);
  font-family:"Noto Serif SC",serif;
}
.lesson-item.done .circle{background:var(--jade);box-shadow:0 0 0 1.5px var(--jade)}
.lesson-item[disabled] .circle{background:#bbb;box-shadow:0 0 0 1.5px #aaa}
.lesson-tag{color:var(--red);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.lesson-name{color:var(--ink);font-size:16px;font-weight:800;margin-top:2px}
.lesson-meta{color:var(--ink-soft);font-size:12px;margin-top:3px;font-weight:600}
.lesson-types{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.type-chip{
  font-size:10px;background:var(--paper);color:var(--ink-soft);
  padding:2px 7px;border-radius:8px;font-weight:700;
}

/* ===== Lesson screen ===== */
.lesson-page{flex:1;display:flex;flex-direction:column;min-height:0}
.top-bar{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:#fff;border-bottom:2px solid var(--gold);
}
.close-btn{background:none;padding:4px;font-size:22px;color:var(--ink-soft)}
.top-bar .progress-bg{flex:1;height:10px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--paper-dark)}
.top-bar .progress-fill{height:100%;transition:width .3s;background:linear-gradient(90deg,var(--gold-bright),var(--gold))}
.hearts-mini{display:flex;align-items:center;gap:3px;color:var(--red);font-weight:800;font-size:14px}

.lesson-body{flex:1;padding:20px 18px;overflow-y:auto}

/* Teach card */
.teach-card{
  position:relative;
  background:#fff;border-radius:18px;padding:30px 24px;
  display:flex;flex-direction:column;align-items:center;
  border:2px solid var(--gold);margin-top:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.teach-card::before{
  content:"";position:absolute;inset:6px;border:1px dashed var(--paper-dark);border-radius:14px;pointer-events:none;
}
.teach-hanzi{
  font-family:"Noto Serif SC",serif;
  font-size:84px;font-weight:900;line-height:1.1;text-align:center;
  color:var(--ink);position:relative;
}
.teach-pinyin{font-size:24px;color:var(--red);margin-top:8px;font-weight:700;letter-spacing:1px}
.divider{width:60px;height:2px;background:var(--gold);margin:18px 0;border-radius:1px}
.teach-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.teach-pt{font-size:24px;font-weight:800;margin-top:8px;text-align:center;color:var(--ink)}
.audio-btn{
  margin-top:18px;
  background:var(--red);color:#fff;padding:10px 18px;border-radius:999px;
  font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px;
  border:2px solid var(--gold);
}
.audio-btn:active{transform:scale(.96)}
.audio-btn.small{margin:0;padding:6px 12px;font-size:12px}

/* Quiz */
.quiz-label{
  font-size:12px;color:var(--red);text-transform:uppercase;
  letter-spacing:2px;margin-bottom:10px;font-weight:800;text-align:center;
}
.prompt-box{
  background:#fff;padding:24px 18px;border-radius:14px;
  text-align:center;border:2px solid var(--gold);margin-bottom:18px;
  position:relative;
}
.prompt-text{font-size:24px;font-weight:800;color:var(--ink)}
.prompt-text.hanzi{font-family:"Noto Serif SC",serif;font-size:48px;font-weight:900}
.prompt-pinyin{font-size:14px;color:var(--ink-soft);margin-top:6px;font-weight:600}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  padding:14px;border-radius:12px;border:2px solid var(--paper-dark);
  background:#fff;text-align:center;width:100%;
  transition:transform .12s;
}
.option:active{transform:scale(.98)}
.option.selected{background:#FFF3D6;border-color:var(--gold)}
.option.correct{background:#E8F8F2;border-color:var(--jade)}
.option.wrong{background:#FDE8EA;border-color:var(--red)}
.option-text{font-size:16px;font-weight:700;color:var(--ink)}
.option-text.hanzi{font-family:"Noto Serif SC",serif;font-size:24px;font-weight:900}
.option-pinyin{font-size:12px;color:var(--ink-soft);margin-top:4px;font-weight:600}

/* Listen exercise */
.listen-big{
  background:#fff;border:2px solid var(--gold);border-radius:18px;
  padding:40px 20px;text-align:center;margin-bottom:18px;
}
.listen-big .audio-btn{font-size:18px;padding:18px 28px}
.listen-big-label{margin-top:14px;font-size:13px;color:var(--ink-soft);font-weight:700}

/* Tone exercise */
.tone-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tone-option{
  padding:18px 8px;border-radius:12px;border:2px solid var(--paper-dark);
  background:#fff;text-align:center;
}
.tone-option.selected{background:#FFF3D6;border-color:var(--gold)}
.tone-option.correct{background:#E8F8F2;border-color:var(--jade)}
.tone-option.wrong{background:#FDE8EA;border-color:var(--red)}
.tone-num{font-size:30px;font-weight:900;color:var(--red);font-family:"Noto Serif SC",serif}
.tone-desc{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:700}
.tone-mark{font-size:22px;color:var(--ink);margin-top:2px}

/* Type pinyin */
.type-input{
  width:100%;padding:14px;font-size:18px;font-weight:700;text-align:center;
  border:2px solid var(--paper-dark);border-radius:12px;background:#fff;color:var(--ink);
  outline:none;
}
.type-input:focus{border-color:var(--gold)}
.type-hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px;font-weight:600}

/* Write/trace exercise */
.write-stage{
  position:relative;background:#fff;border:2px solid var(--gold);border-radius:18px;
  padding:14px;margin-bottom:14px;
}
.write-canvas-wrap{
  position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:0 auto;
  background:
    linear-gradient(var(--paper-dark) 0 0) center/100% 1px no-repeat,
    linear-gradient(90deg,var(--paper-dark) 0 0) center/1px 100% no-repeat,
    linear-gradient(45deg,transparent 49.5%,var(--paper-dark) 49.5% 50.5%,transparent 50.5%) no-repeat,
    linear-gradient(-45deg,transparent 49.5%,var(--paper-dark) 49.5% 50.5%,transparent 50.5%) no-repeat,
    #FFFDF6;
  border:2px dashed var(--red);border-radius:12px;
}
.write-hanzi-ghost{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;font-weight:900;
  color:rgba(200,16,46,.10);font-size:240px;line-height:1;pointer-events:none;
  user-select:none;
}
.write-canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;touch-action:none;cursor:crosshair}
.write-pinyin{text-align:center;font-size:18px;color:var(--red);margin-top:10px;font-weight:700}
.write-pt{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:2px;font-weight:600}
.write-tools{display:flex;gap:8px;margin-top:12px;justify-content:center}
.tool-btn{
  background:#fff;border:2px solid var(--gold);color:var(--ink);
  padding:8px 16px;border-radius:999px;font-weight:800;font-size:13px;
}

/* Build sentence exercise */
.build-target{
  background:#fff;border:2px dashed var(--gold);border-radius:14px;
  padding:14px;min-height:60px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:center;margin-bottom:14px;
}
.build-slot{
  padding:8px 12px;background:var(--paper);border-radius:10px;
  font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900;color:var(--ink);
  border:1px solid var(--paper-dark);
}
.build-slot.empty{color:var(--paper-dark);background:transparent;border:1px dashed var(--paper-dark);min-width:36px;text-align:center}
.build-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.build-word{
  padding:10px 14px;background:#fff;border:2px solid var(--gold);border-radius:10px;
  font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.build-word:disabled{opacity:.25;cursor:default}
.build-word .bw-pinyin{font-family:"ZCOOL XiaoWei",sans-serif;font-size:11px;color:var(--ink-soft);font-weight:600}

/* Footer */
.footer{
  padding:16px;padding-bottom:max(env(safe-area-inset-bottom),16px);
  background:#fff;border-top:2px solid var(--gold);
}
.btn-primary{
  width:100%;padding:16px;border-radius:14px;
  background:var(--red);color:#fff;font-weight:900;
  font-size:16px;letter-spacing:1px;
  border:2px solid var(--gold);
  text-transform:uppercase;
}
.btn-primary[disabled]{background:#bbb;border-color:#999}
.feedback{text-align:center;font-weight:800;margin-bottom:8px;font-size:15px}
.feedback.ok{color:var(--jade)}
.feedback.bad{color:var(--red)}

/* End screens */
.end-page{flex:1;display:flex;flex-direction:column}
.end-body{
  flex:1;padding:30px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;text-align:center;
  position:relative;
}
.end-emoji{font-size:80px}
.end-title{font-family:"Ma Shan Zheng",serif;font-size:38px;font-weight:900;margin-top:12px;letter-spacing:3px}
.end-sub{font-size:14px;opacity:.95;margin-top:6px;font-weight:600}
.end-stats{display:flex;gap:12px;margin-top:30px}
.end-stat{
  background:rgba(255,255,255,.18);padding:16px 14px;border-radius:14px;
  min-width:90px;text-align:center;border:1.5px solid rgba(255,222,0,.5);
}
.end-stat-val{font-size:26px;font-weight:900;font-family:"Noto Serif SC",serif}
.end-stat-lbl{font-size:11px;opacity:.95;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}
.new-badges{
  margin-top:24px;background:#fff;padding:16px;border-radius:14px;
  align-self:stretch;color:var(--ink);border:2px solid var(--gold);
}
.nb-title{font-weight:800;font-size:12px;color:var(--red);margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
.nb-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.nb-icon{font-size:36px}
.nb-name{font-size:16px;font-weight:800}
.nb-desc{font-size:13px;color:var(--ink-soft)}
.btn-end{
  width:100%;padding:16px;border-radius:14px;
  background:#fff;color:var(--red);font-weight:900;font-size:16px;
  border:2px solid var(--gold);text-transform:uppercase;letter-spacing:1px;
}
.btn-exit{display:block;width:100%;padding:12px;text-align:center;background:none;color:#fff;font-weight:700;margin-top:6px}

/* Badges / progress page */
.badges-page{padding:16px;padding-bottom:40px;flex:1;overflow-y:auto}
.badges-page h1{font-family:"Ma Shan Zheng",serif;font-size:32px;font-weight:900;margin:0;color:var(--red);letter-spacing:2px}
.badges-page .sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;font-weight:600}
.stats-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{
  flex:1;min-width:90px;background:#fff;padding:14px 8px;border-radius:12px;
  text-align:center;border:2px solid var(--gold);
}
.stat-val{font-size:24px;font-weight:900;color:var(--red);font-family:"Noto Serif SC",serif}
.stat-lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px;font-weight:800;letter-spacing:1px}
.badge-row{
  display:flex;align-items:center;gap:14px;
  background:#fff;padding:14px;border-radius:14px;
  margin-bottom:10px;border:1.5px solid var(--paper-dark);
}
.badge-row.unlocked{border-color:var(--gold);background:linear-gradient(180deg,#fff 0%,#FFFAE6 100%)}
.badge-row.locked{opacity:.45}
.badge-icon{font-size:36px}
.badge-title{font-size:15px;font-weight:800;color:var(--ink)}
.badge-desc{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.reset-btn{
  width:100%;margin-top:30px;padding:14px;background:none;
  border:2px solid var(--red);color:var(--red);border-radius:12px;
  font-weight:800;letter-spacing:1px;
}
.back-btn{background:none;padding:8px 12px;color:var(--red);font-weight:800;font-size:14px}
.page-header{display:flex;align-items:center;padding:8px 8px 0}

/* Vocab review page */
.vocab-list-item{
  display:flex;align-items:center;gap:14px;
  background:#fff;padding:12px 14px;border-radius:12px;
  margin-bottom:8px;border:1.5px solid var(--paper-dark);
}
.vli-hanzi{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;min-width:54px}
.vli-info{flex:1}
.vli-pinyin{font-size:13px;color:var(--red);font-weight:700}
.vli-pt{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:2px}

/* ===== Chat (AI conversation) ===== */
.chat-page{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--cream)}
.chat-top{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:#fff;border-bottom:2px solid var(--gold);
}

const STORAGE_KEY = '@mandarim/v2';
const MAX_HEARTS = 5;
const HEART_REGEN_MS = 30 * 60 * 1000;
const XP_PER_LEVEL = 100;

const DEFAULT = {
  xp:0,hearts:MAX_HEARTS,heartsUpdatedAt:Date.now(),
  completedLessons:[],completedLevels:[],learnedVocab:[],
  perfectLessons:0,unlockedBadges:[],writeCount:0,listenCount:0,
};

function applyHeartRegen(s){
  if(s.hearts>=MAX_HEARTS) return {...s,heartsUpdatedAt:Date.now()};
  const now=Date.now();
  const elapsed=now-(s.heartsUpdatedAt||now);
  const gained=Math.floor(elapsed/HEART_REGEN_MS);
  if(gained<=0) return s;
  const hearts=Math.min(MAX_HEARTS,s.hearts+gained);
  const remainder=elapsed-gained*HEART_REGEN_MS;
  return {...s,hearts,heartsUpdatedAt:now-remainder};
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return {...DEFAULT};
    return applyHeartRegen({...DEFAULT,...JSON.parse(raw)});
  }catch{ return {...DEFAULT}; }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch{} }

let state = loadState();
let screen = { name:'home' };

   ÁUDIO (TTS do navegador)
   ============================================================ */
let zhVoice = null;
let voicesReady = false;
let audioWarmed = false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  if(voices && voices.length) voicesReady = true;
  zhVoice = voices.find(v=>/^zh(-|_)?(CN|Hans)/i.test(v.lang))
         || voices.find(v=>/^cmn/i.test(v.lang))
         || voices.find(v=>/^zh/i.test(v.lang))
         || null;
  updateAudioNotice();
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  // Some browsers populate voices lazily — retry a couple of times
  setTimeout(pickVoice, 500);
  setTimeout(pickVoice, 1500);
}
function speak(text){
  if(!('speechSynthesis' in window)){ showAudioToast('Seu navegador não suporta áudio (Web Speech API).'); return; }
  try{
    // Warm up the engine on first user gesture (helps iOS/Safari)
    if(!audioWarmed){
      audioWarmed = true;
      const warm = new SpeechSynthesisUtterance('');
      warm.volume = 0;
      try{ speechSynthesis.speak(warm); }catch{}
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if(zhVoice) u.voice = zhVoice;
    u.rate = 0.85;
    u.pitch = 1;
    let spoke = false;
    u.onstart = ()=>{ spoke = true; };
    u.onerror = ()=>{ if(!spoke) showAudioToast(audioMissingMsg()); };
    speechSynthesis.speak(u);
    // If nothing happened after 1.2s, likely no usable voice
    setTimeout(()=>{ if(!spoke && !speechSynthesis.speaking) showAudioToast(audioMissingMsg()); }, 1200);
  }catch{ showAudioToast(audioMissingMsg()); }
}
function audioMissingMsg(){
  return zhVoice
    ? 'Não foi possível tocar o áudio agora. Toque novamente.'
    : 'Nenhuma voz em chinês (zh-CN) encontrada. Instale uma voz chinesa nas configurações de TTS do seu sistema.';
}
let toastTimer = null;
function showAudioToast(msg){
  let el = document.getElementById('audio-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'audio-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:12px;border:2px solid #D4AF37;font-size:13px;font-weight:700;max-width:88%;text-align:center;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.3)';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 4500);
}

/* ============================================================
   HELPERS
   ============================================================ */
const playerLevel = (xp)=>Math.floor(xp/XP_PER_LEVEL)+1;
const xpInLevel = (xp)=>xp%XP_PER_LEVEL;

function getLesson(lessonId){
  for(const lvl of LEVELS){
    const l = lvl.lessons.find(x=>x.id===lessonId);
    if(l) return {level:lvl,lesson:l};
  }
  return null;
}
function isLessonUnlocked(lessonId){
  for(let li=0;li<LEVELS.length;li++){
    const lvl=LEVELS[li];
    const idx=lvl.lessons.findIndex(l=>l.id===lessonId);
    if(idx===-1) continue;
    if(li===0&&idx===0) return true;
    if(idx===0) return state.completedLevels.includes(LEVELS[li-1].id);
    return state.completedLessons.includes(lvl.lessons[idx-1].id);
  }
  return false;
}
function isLevelUnlocked(idx){ return idx===0||state.completedLevels.includes(LEVELS[idx-1].id); }

function detectTone(pinyin){
  // Returns array of tone numbers (1-4) in order
  const map = {
    'ā':1,'á':2,'ǎ':3,'à':4,
    'ē':1,'é':2,'ě':3,'è':4,
    'ī':1,'í':2,'ǐ':3,'ì':4,
    'ō':1,'ó':2,'ǒ':3,'ò':4,
    'ū':1,'ú':2,'ǔ':3,'ù':4,
    'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4,
  };
  const out = [];
  for(const ch of pinyin){ if(map[ch]) out.push(map[ch]); }
  return out;
}
function stripTones(s){
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
}

function completeLesson(lesson,levelId,mistakes){
  const alreadyDone = state.completedLessons.includes(lesson.id);
  const xpGained = alreadyDone ? 5 : 10 + Math.max(0,10-mistakes*5);
  state.xp += xpGained;
  if(!alreadyDone) state.completedLessons = [...state.completedLessons,lesson.id];
  if(mistakes===0) state.perfectLessons += 1;
  const newVocab = lesson.teaches.filter(v=>!state.learnedVocab.includes(v));
  state.learnedVocab = [...state.learnedVocab,...newVocab];
  const level = LEVELS.find(l=>l.id===levelId);
  const allDone = level.lessons.every(l=>state.completedLessons.includes(l.id));
  if(allDone && !state.completedLevels.includes(levelId)){
    state.completedLevels = [...state.completedLevels,levelId];
  }
  const newBadges=[];
  for(const b of BADGES){
    if(!state.unlockedBadges.includes(b.id)&&b.check(state)){
      state.unlockedBadges=[...state.unlockedBadges,b.id];
      newBadges.push(b);
    }
  }
  saveState();
  return {xpGained,newBadges};
}
function loseHeart(){
  state = applyHeartRegen(state);
  if(state.hearts>=MAX_HEARTS) state.heartsUpdatedAt = Date.now();
  state.hearts = Math.max(0,state.hearts-1);
  saveState();
}
function restoreHearts(){ state.hearts = MAX_HEARTS; state.heartsUpdatedAt = Date.now(); saveState(); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bumpBadgeCounter(field){
  state[field] = (state[field]||0)+1;
  for(const b of BADGES){
    if(!state.unlockedBadges.includes(b.id)&&b.check(state)){
      state.unlockedBadges=[...state.unlockedBadges,b.id];
    }
  }
  saveState();
}

  teach:'aprender',quiz:'múltipla',listen:'áudio',listenPt:'áudio→pt',
  tone:'tom',typePinyin:'pinyin',write:'escrita',build:'frase',

}

function renderBuild(ex,level){
  const w = V[ex.vocabId];
  const built = screen.buildOrder || [];
  const slotsTotal = ex.parts.length;
  const slotsHtml = Array.from({length:slotsTotal}).map((_,i)=>{
    const word = built[i];
    return word!=null ? `<div class="build-slot">${escapeHtml(word)}</div>` : `<div class="build-slot empty">·</div>`;
  }).join('');
  // Pool: parts + distractors, shuffled deterministically
  const pool = ex.parts.concat(ex.distractors||[]).slice().sort();
  const used = new Set();
  built.forEach(b=>used.add(b));
  const poolHtml = pool.map((word,i)=>{
    // Look up pinyin of word if it exists in vocab by hanzi
    const match = Object.values(V).find(x=>x.hanzi===word);
    const pinyin = match?match.pinyin:'';
    const isUsed = built.some(b=>b===word);
    return `<button class="build-word" data-build-word="${escapeHtml(word)}" data-build-idx="${i}" ${isUsed||screen.checked?'disabled':''}>
      <span>${escapeHtml(word)}</span>
      ${pinyin?`<span class="bw-pinyin">${escapeHtml(pinyin)}</span>`:''}
    </button>`;
  }).join('');
  const feedback = screen.checked
    ? (built.join('')===ex.parts.join('')
       ? `<div class="feedback ok">✓ Perfeito! ${escapeHtml(w.hanzi)} — ${escapeHtml(w.pinyin)}</div>`
       : `<div class="feedback bad">✗ Resposta: ${escapeHtml(ex.parts.join(' '))} — ${escapeHtml(w.pinyin)}</div>`)
    : '';
  return `
    <div class="quiz-label">Monte a frase: "${escapeHtml(w.pt)}"</div>
    <div class="build-target">${slotsHtml}</div>
    <div class="build-pool">${poolHtml}</div>

}

function renderLesson(){

  const ex = lesson.exercises[screen.idx];
  const total = lesson.exercises.length;
  const pct = (screen.idx/total)*100;
  document.body.style.background = '';

  let bodyHtml='';
  if(ex.type==='teach') bodyHtml = renderTeach(ex,level);
  else if(ex.type==='quiz') bodyHtml = renderQuiz(ex,level);
  else if(ex.type==='listen') bodyHtml = renderListen(ex,level,false);
  else if(ex.type==='listenPt') bodyHtml = renderListen(ex,level,true);
  else if(ex.type==='tone') bodyHtml = renderTone(ex,level);
  else if(ex.type==='typePinyin') bodyHtml = renderTypePinyin(ex,level);
  else if(ex.type==='write') bodyHtml = renderWrite(ex,level);
  else if(ex.type==='build') bodyHtml = renderBuild(ex,level);

  let footerHtml;
  if(ex.type==='teach' || ex.type==='write'){
    footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="next">Continuar</button>`;
  } else if(ex.type==='build'){
    const built = screen.buildOrder||[];
    if(!screen.checked){
      const ready = built.length===ex.parts.length;
      footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="check-build" ${ready?'':'disabled'}>Verificar</button>`;
    } else {
      footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="next">Continuar</button>`;
    }
  } else if(ex.type==='typePinyin'){
    if(!screen.checked){
      const ready = (screen.typedValue||'').trim().length>0;
      footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="check-type" ${ready?'':'disabled'}>Verificar</button>`;
    } else {
      footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="next">Continuar</button>`;
    }
  } else if(!screen.checked){
    footerHtml = `<button class="btn-primary" style="background:${level.color}" data-action="check" ${screen.selected!=null?'':'disabled'}>Verificar</button>`;
  } else {
    const w = V[ex.vocabId];
    let isOk=false, ansText='';
    if(ex.type==='tone'){
      const tones = w.tones || detectTone(w.pinyin);
      const correctTone = tones[0] || 1;
      isOk = String(correctTone)===screen.selected;
      ansText = `${correctTone}º tom (${w.pinyin})`;
    } else {
      isOk = screen.selected===ex.vocabId;
      ansText = ex.type==='listen' ? `${w.hanzi} (${w.pinyin})`
              : ex.type==='listenPt' ? w.pt
              : ex.answer==='hanzi' ? `${w.hanzi} (${w.pinyin})`
              : ex.answer==='pinyin' ? w.pinyin
              : w.pt;
    }
    footerHtml = `
      <div class="feedback ${isOk?'ok':'bad'}">${isOk?'✓ Correto!':'✗ Resposta: '+escapeHtml(ansText)}</div>
      <button class="btn-primary" style="background:${level.color}" data-action="next">Continuar</button>`;
  }

  app.innerHTML = `
    ${statusBarHtml()}
    <div class="lesson-page">
      <div class="top-bar">
        <button class="close-btn" data-action="exit">✕</button>
        <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="hearts-mini">❤ ${state.hearts}</div>
      </div>
      <div class="lesson-body">${bodyHtml}</div>
      <div class="footer">${footerHtml}</div>
    </div>`;

  bindLessonEvents(ex,level,lesson,total);

  // (auto-play removed — TTS exige gesto do usuário em muitos navegadores)
  // Setup canvas if write
  if(ex.type==='write') setupCanvas();
}

function bindLessonEvents(ex,level,lesson,total){
  const exitBtn = app.querySelector('[data-action="exit"]');
  if(exitBtn) exitBtn.addEventListener('click',()=>{ screen={name:'level',levelId:level.id}; render(); });

  app.querySelectorAll('[data-action="speak"]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.preventDefault(); speak(el.dataset.text); });
  });
  app.querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('click',()=>{ screen.selected = el.dataset.id; render(); });
  });
  const input = app.querySelector('[data-action="type-input"]');
  if(input){
    input.addEventListener('input',()=>{ screen.typedValue = input.value; updateTypeCheckBtn(); });
    input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); const btn = app.querySelector('[data-action="check-type"]'); if(btn && !btn.disabled) btn.click(); } });
    setTimeout(()=>{ if(!screen.checked) input.focus(); },50);
  }
  const clearCanvas = app.querySelector('[data-action="clear-canvas"]');
  if(clearCanvas) clearCanvas.addEventListener('click',()=>{ clearWriteCanvas(); });

  // build word buttons
  app.querySelectorAll('[data-build-word]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(screen.checked) return;
      screen.buildOrder = (screen.buildOrder||[]).concat([el.dataset.buildWord]);
      if(screen.buildOrder.length > ex.parts.length) screen.buildOrder = screen.buildOrder.slice(0,ex.parts.length);
      render();
    });
  });
  const resetBuild = app.querySelector('[data-action="build-reset"]');
  if(resetBuild) resetBuild.addEventListener('click',()=>{ screen.buildOrder = []; render(); });

  const check = app.querySelector('[data-action="check"]');
  if(check) check.addEventListener('click',()=>{
    if(screen.selected==null) return;
    screen.checked = true;
    const w = V[ex.vocabId];
    let ok = false;
    if(ex.type==='tone'){
      const tones = w.tones || detectTone(w.pinyin);
      ok = String(tones[0]||1)===screen.selected;
    } else {
      ok = screen.selected===ex.vocabId;
    }
    if(ok && (ex.type==='listen'||ex.type==='listenPt')) bumpBadgeCounter('listenCount');
    if(!ok) handleMistake(level);
    render();
  });
  const checkType = app.querySelector('[data-action="check-type"]');
  if(checkType) checkType.addEventListener('click',()=>{
    const w = V[ex.vocabId];
    const a = stripTones(screen.typedValue||'');
    const b = stripTones(w.pinyin);
    screen.checked = true;
    if(a!==b) handleMistake(level);
    render();
  });
  const checkBuild = app.querySelector('[data-action="check-build"]');
  if(checkBuild) checkBuild.addEventListener('click',()=>{
    screen.checked = true;
    const built = (screen.buildOrder||[]).join('');
    if(built!==ex.parts.join('')) handleMistake(level);
    render();
  });
  const nxt = app.querySelector('[data-action="next"]');
  if(nxt) nxt.addEventListener('click',()=>{
    if(ex.type==='write'){
      if(screen.writeDrawn) bumpBadgeCounter('writeCount');
    }
    if(screen.idx+1>=total){
      const r = completeLesson(lesson,level.id,screen.mistakes);
      screen = {name:'finished',levelId:level.id,xpGained:r.xpGained,newBadges:r.newBadges,mistakes:screen.mistakes};
      render();
    } else {
      screen.idx += 1;
      screen.selected = null;
      screen.checked = false;
      screen.typedValue = '';
      screen.writeDrawn = false;
      screen.audioPlayed = false;
      screen.buildOrder = [];
      render();
    }
  });
}

function updateTypeCheckBtn(){
  const btn = app.querySelector('[data-action="check-type"]');

  const ready = (screen.typedValue||'').trim().length>0;

}

let canvasCtx=null,canvasEl=null,drawing=false,lastPt=null;
function setupCanvas(){
  canvasEl = app.querySelector('[data-canvas]');
  if(!canvasEl) return;
  const wrap = canvasEl.parentElement;
  const size = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvasEl.width = size.width * dpr;
  canvasEl.height = size.height * dpr;
  canvasCtx = canvasEl.getContext('2d');
  canvasCtx.scale(dpr,dpr);
  canvasCtx.lineCap='round';
  canvasCtx.lineJoin='round';
  canvasCtx.lineWidth=8;
  canvasCtx.strokeStyle='#1A1A1A';

  const getPt=(e)=>{
    const r = canvasEl.getBoundingClientRect();
    const t = e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  };
  const start=(e)=>{ e.preventDefault(); drawing=true; lastPt=getPt(e); screen.writeDrawn=true; };
  const move=(e)=>{
    if(!drawing) return;
    e.preventDefault();
    const p=getPt(e);
    canvasCtx.beginPath();
    canvasCtx.moveTo(lastPt.x,lastPt.y);
    canvasCtx.lineTo(p.x,p.y);
    canvasCtx.stroke();
    lastPt=p;
  };
  const end=()=>{ drawing=false; };
  canvasEl.addEventListener('mousedown',start);
  canvasEl.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  canvasEl.addEventListener('touchstart',start,{passive:false});
  canvasEl.addEventListener('touchmove',move,{passive:false});
  canvasEl.addEventListener('touchend',end);
}
function clearWriteCanvas(){
  if(!canvasCtx||!canvasEl) return;
  canvasCtx.clearRect(0,0,canvasEl.width,canvasEl.height);
  screen.writeDrawn=false;
}

/* ============================================================
   CHAT — AI conversation tutor (Anthropic Claude API, BYOK)
   ============================================================ */
const CHAT_STORAGE = {
  key: '@mandarim/v2/chat/apikey',
  model: '@mandarim/v2/chat/model',
  history: '@mandarim/v2/chat/history',
  showPinyin: '@mandarim/v2/chat/showPinyin',
  showPt: '@mandarim/v2/chat/showPt',
};
const MODELS = [
  { id:'claude-opus-4-7', label:'Opus 4.7 (melhor, mais caro)' },
  { id:'claude-sonnet-4-6', label:'Sonnet 4.6 (equilibrado)' },
  { id:'claude-haiku-4-5', label:'Haiku 4.5 (rápido, barato)' },
];
const MAX_HISTORY_TURNS = 20;

function chatGet(key, def){ try{ const v=localStorage.getItem(key); return v==null?def:JSON.parse(v); }catch{ return def; } }
function chatSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }

function chatHistory(){ return chatGet(CHAT_STORAGE.history, []); }
function chatSetHistory(h){ chatSet(CHAT_STORAGE.history, h); }
function chatApiKey(){ return chatGet(CHAT_STORAGE.key, ''); }
function chatModel(){ return chatGet(CHAT_STORAGE.model, MODELS[0].id); }

let chatPending = false;
let chatModalOpen = false;
let chatDraft = '';

function chatSystemPrompt(){
  const learned = state.learnedVocab.map(id=>{
    const v = V[id]; if(!v) return null;
    return `${v.hanzi} (${v.pinyin}) = ${v.pt}`;
  }).filter(Boolean).join('; ');
  const completedLevels = state.completedLevels.length;
  const totalLevels = LEVELS.length;
  return `Você é um tutor amigável e paciente de chinês mandarim para um estudante brasileiro que está aprendendo via um app.

NÍVEL DO ALUNO:
- Lições completadas: ${state.completedLessons.length}
- Níveis terminados: ${completedLevels} de ${totalLevels}
- Palavras já aprendidas (${state.learnedVocab.length}): ${learned || '(nenhuma ainda)'}

REGRAS:
1. Responda em mandarim usando primariamente o vocabulário que o aluno já conhece. Você pode introduzir 1-2 palavras novas por turno, mas sempre traduza claramente.
2. Mantenha respostas curtas e conversacionais (1-3 frases). Não dê aulas longas — converse de verdade.
3. Se o aluno escreveu algo em chinês com erros (gramática, tom, escolha de caractere), liste em "corrections" com explicação curta em português. Se o aluno escreveu certo, deixe "corrections" vazio.
4. Em "suggestions", ofereça 1-3 maneiras alternativas/melhores de dizer o que o aluno tentou dizer. Se não há nada a sugerir, deixe vazio.
5. Se o aluno escrever em português ou em português+chinês misturado, está OK — traduza ou responda à intenção dele em chinês.
6. Use tons corretos no pinyin (ā á ǎ à etc).
7. Seja encorajador. Comemore quando o aluno acertar.
8. Adeque a complexidade ao nível do aluno. Para iniciantes (poucas lições), use frases muito simples.

Responda APENAS no formato JSON especificado.`;
}

const CHAT_SCHEMA = {
  type:'object',
  properties:{
    reply_hanzi:{ type:'string', description:'Sua resposta em caracteres chineses (hanzi).' },
    reply_pinyin:{ type:'string', description:'A mesma resposta em pinyin com tons.' },
    reply_pt:{ type:'string', description:'Tradução em português brasileiro.' },
    corrections:{
      type:'array',
      description:'Correções aos erros do aluno. Vazio se não houver.',
      items:{
        type:'object',
        properties:{
          original:{ type:'string', description:'Trecho original do aluno com erro.' },
          fixed:{ type:'string', description:'Versão corrigida em hanzi.' },
          explanation:{ type:'string', description:'Explicação breve do erro em português.' },
        },
        required:['original','fixed','explanation'],
        additionalProperties:false,
      },
    },
    suggestions:{
      type:'array',
      description:'Sugestões de frases alternativas em hanzi (com pinyin e tradução opcional, ex: 我很好 (wǒ hěn hǎo) — estou bem). Vazio se não houver.',
      items:{ type:'string' },
    },
  },
  required:['reply_hanzi','reply_pinyin','reply_pt','corrections','suggestions'],
  additionalProperties:false,
};

async function callClaude(userText){
  const apiKey = chatApiKey();
  if(!apiKey) throw new Error('NO_KEY');
  const model = chatModel();
  const history = chatHistory();
  const recentTurns = history.slice(-MAX_HISTORY_TURNS*2);

  const messages = [];
  for(const t of recentTurns){
    if(t.role === 'user'){
      messages.push({ role:'user', content: t.text });
    } else if(t.role === 'assistant' && t.data){
      messages.push({ role:'assistant', content: JSON.stringify(t.data) });
    }
  }
  messages.push({ role:'user', content: userText });

  const body = {
    model,
    max_tokens: 1024,
    system: [{
      type:'text',
      text: chatSystemPrompt(),
      cache_control:{ type:'ephemeral' },
    }],
    output_config:{
      format:{ type:'json_schema', schema: CHAT_SCHEMA },
    },
    messages,
  };

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify(body),
  });

  if(!res.ok){
    let msg = `HTTP ${res.status}`;
    try{
      const err = await res.json();
      msg = err?.error?.message || msg;
    }catch{}
    if(res.status === 401) throw new Error('BAD_KEY');
    if(res.status === 429) throw new Error('RATE_LIMIT:'+msg);
    if(res.status === 400) throw new Error('BAD_REQUEST:'+msg);
    throw new Error('API:'+msg);
  }

  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('NO_CONTENT');
  let parsed;
  try{ parsed = JSON.parse(textBlock.text); }
  catch{ throw new Error('PARSE_ERROR'); }
  return { parsed, usage: data.usage };
}

async function sendChatMessage(text){
  text = (text||'').trim();
  if(!text || chatPending) return;
  if(!chatApiKey()){ chatModalOpen = true; render(); return; }

  const history = chatHistory();
  history.push({ role:'user', text, ts: Date.now() });
  chatSetHistory(history);
  chatDraft = '';
  chatPending = true;
  render();

  try{
    const { parsed } = await callClaude(text);
    const h2 = chatHistory();
    h2.push({ role:'assistant', data: parsed, ts: Date.now() });
    chatSetHistory(h2);
  }catch(e){
    const h2 = chatHistory();
    let msg = 'Erro ao chamar a API.';
    const m = String(e.message||e);
    if(m==='NO_KEY') msg = 'Configure sua chave da API em ⚙ Ajustes.';
    else if(m==='BAD_KEY') msg = 'Chave da API inválida ou sem créditos. Verifique em ⚙ Ajustes.';
    else if(m.startsWith('RATE_LIMIT')) msg = 'Você atingiu o limite de requisições. Espere um pouco e tente de novo.';
    else if(m.startsWith('BAD_REQUEST')) msg = 'Requisição inválida: ' + m.slice(12);
    else if(m.startsWith('API')) msg = 'Erro da API: ' + m.slice(4);
    else if(m==='PARSE_ERROR') msg = 'Resposta da IA veio em formato inesperado. Tente de novo.';
    else msg = 'Erro de rede ou CORS. Verifique sua conexão.';
    h2.push({ role:'error', text: msg, ts: Date.now() });
    chatSetHistory(h2);
  }finally{
    chatPending = false;
    render();
  }
}

            ${d.corrections.map(c=>`
              <div class="b-corr-row">
                <span class="b-corr-orig">${escapeHtml2(c.original||'')}</span>
                <span class="b-corr-fix">${escapeHtml2(c.fixed||'')}</span>
                <div class="b-corr-expl">${escapeHtml2(c.explanation||'')}</div>
              </div>`).join('')}
          </div>`;
        const sugHtml = (d.suggestions||[]).length === 0 ? '' : `
          <div class="b-card suggest">
            <div class="b-card-title">💡 Sugestões</div>
            ${d.suggestions.map(s=>`<div class="b-sug-row">${escapeHtml2(s)}</div>`).join('')}
          </div>`;
        return `
          <div class="bubble ai">
            <div class="b-hanzi">${escapeHtml2(d.reply_hanzi||'')}</div>
            ${showPinyin && d.reply_pinyin ? `<div class="b-pinyin">${escapeHtml2(d.reply_pinyin)}</div>` : ''}
            ${showPt && d.reply_pt ? `<div class="b-pt">${escapeHtml2(d.reply_pt)}</div>` : ''}
            <button class="b-audio" data-action="speak" data-text="${escapeHtml2(d.reply_hanzi||'')}">🔊 Ouvir</button>
          </div>
          ${corrHtml}
          ${sugHtml}`;
      }
    }).join('');
    if(chatPending){
      bodyHtml += `<div class="b-thinking">老师在想… (pensando)</div>`;
    }
  }

  const sendDisabled = chatPending || !(chatDraft||'').trim();
  app.innerHTML = `
    ${statusBarHtml()}
    <div class="chat-page">
      <div class="chat-top">
        <button class="top-icon" data-action="back-home">←</button>
        <div class="title">中文对话</div>
        <button class="top-icon" data-action="open-settings" title="Ajustes">⚙</button>
      </div>
      <div class="chat-body" id="chat-body">${bodyHtml}</div>
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="${hasKey?'Escreva em português ou chinês…':'Configure sua chave primeiro (⚙)'}" ${hasKey?'':'disabled'}></textarea>
        <button class="chat-send" data-action="send" ${sendDisabled||!hasKey?'disabled':''}>➤</button>
      </div>
    </div>
    ${chatModalOpen ? renderChatSettingsModal() : ''}`;

  // Bind
  app.querySelector('[data-action="back-home"]').addEventListener('click',()=>{ screen={name:'home'}; chatModalOpen=false; render(); });
  app.querySelector('[data-action="open-settings"]').addEventListener('click',()=>{ chatModalOpen=true; render(); });
  const startBtn = app.querySelector('[data-action="suggest-start"]');
  if(startBtn) startBtn.addEventListener('click',()=>{ sendChatMessage('你好！我们用中文聊天吧。'); });
  const openSettings2 = app.querySelectorAll('[data-action="open-settings"]');
  openSettings2.forEach(el=>{ if(!el.dataset.bound){ el.dataset.bound='1'; } });

  app.querySelectorAll('[data-action="speak"]').forEach(el=>{
    el.addEventListener('click',()=>speak(el.dataset.text));
  });
  const input = app.querySelector('#chat-input');
  if(input){
    input.value = chatDraft;
    input.addEventListener('input',()=>{
      chatDraft = input.value;
      const sb = app.querySelector('[data-action="send"]');
      if(sb){
        if(chatPending || !chatDraft.trim() || !hasKey) sb.setAttribute('disabled',''); else sb.removeAttribute('disabled');
      }
      input.style.height='auto';
      input.style.height=Math.min(120, input.scrollHeight)+'px';
    });
    input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(input.value); }
    });
  }
  const sendBtn = app.querySelector('[data-action="send"]');
  if(sendBtn) sendBtn.addEventListener('click',()=>{
    const v = (app.querySelector('#chat-input')||{}).value || chatDraft;
    sendChatMessage(v);
  });

  // Scroll to bottom
  const cb = app.querySelector('#chat-body');
  if(cb) cb.scrollTop = cb.scrollHeight;

  // Settings modal events
  if(chatModalOpen) bindChatSettingsModal();
}

function renderChatSettingsModal(){
  const key = chatApiKey();
  const model = chatModel();
  const showPinyin = chatGet(CHAT_STORAGE.showPinyin, true);
  const showPt = chatGet(CHAT_STORAGE.showPt, true);
  const masked = key ? '••••••••'+key.slice(-6) : '';
  return `
    <div class="modal-overlay" data-action="modal-close-bg">
      <div class="modal" onclick="event.stopPropagation()">
        <h2>设置 Ajustes do chat</h2>
        <p class="modal-sub">Sua chave fica salva só no seu celular (localStorage).</p>

        <label>Chave da API Anthropic</label>
        <input type="password" id="m-key" placeholder="${masked||'sk-ant-...'}" autocomplete="off" autocapitalize="off">
        <div class="hint">
          Pegue uma em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
          Você precisa adicionar crédito na sua conta Anthropic — cada conversa custa centavos.
          ${key?'<br><strong>Chave atual salva</strong> (deixe em branco pra manter).':''}
        </div>

        <label>Modelo</label>
        <select id="m-model">
          ${MODELS.map(m=>`<option value="${m.id}" ${m.id===model?'selected':''}>${escapeHtml2(m.label)}</option>`).join('')}
        </select>

        <label>Exibição</label>
        <div style="display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--ink)">
          <label style="text-transform:none;letter-spacing:0;margin:0;display:flex;align-items:center;gap:6px">
            <input type="checkbox" id="m-pinyin" ${showPinyin?'checked':''}> Mostrar pinyin
          </label>
          <label style="text-transform:none;letter-spacing:0;margin:0;display:flex;align-items:center;gap:6px">
            <input type="checkbox" id="m-pt" ${showPt?'checked':''}> Mostrar PT
          </label>
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" data-action="modal-cancel">Cancelar</button>
          <button class="btn-save" data-action="modal-save">Salvar</button>
        </div>
        <div class="modal-actions" style="margin-top:8px">
          <button class="btn-danger" data-action="modal-clear-key">Apagar chave</button>
          <button class="btn-danger" data-action="modal-clear-chat">Limpar conversa</button>
        </div>
      </div>
    </div>`;
}

function bindChatSettingsModal(){
  const close = ()=>{ chatModalOpen=false; render(); };
  app.querySelector('[data-action="modal-close-bg"]').addEventListener('click',close);
  app.querySelector('[data-action="modal-cancel"]').addEventListener('click',close);
  app.querySelector('[data-action="modal-save"]').addEventListener('click',()=>{
    const keyEl = document.getElementById('m-key');
    const modelEl = document.getElementById('m-model');
    const pyEl = document.getElementById('m-pinyin');
    const ptEl = document.getElementById('m-pt');
    const newKey = (keyEl.value||'').trim();
    if(newKey) chatSet(CHAT_STORAGE.key, newKey);
    chatSet(CHAT_STORAGE.model, modelEl.value);
    chatSet(CHAT_STORAGE.showPinyin, !!pyEl.checked);
    chatSet(CHAT_STORAGE.showPt, !!ptEl.checked);
    close();
  });
  app.querySelector('[data-action="modal-clear-key"]').addEventListener('click',()=>{
    if(confirm('Apagar a chave salva neste dispositivo?')){
      localStorage.removeItem(CHAT_STORAGE.key);
      close();
    }
  });
  app.querySelector('[data-action="modal-clear-chat"]').addEventListener('click',()=>{
    if(confirm('Apagar todo o histórico de conversa?')){
      chatSetHistory([]);
      close();
    }
  });
}

function render(){
  state = applyHeartRegen(state);
  saveState();
  switch(screen.name){
    case 'home': return renderHome();
    case 'level': return renderLevel();
    case 'lesson': return renderLesson();
    case 'finished': return renderFinished();
    case 'failed': return renderFailed();
    case 'badges': return renderBadges();
    case 'vocab': return renderVocab();
    case 'chat': return renderChat();
  }
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
